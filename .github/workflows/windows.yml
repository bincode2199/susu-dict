name: Windows NativeAOT build and probes
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install pinned pnpm
        run: npm install -g pnpm@11.19.0
      - name: Restore locked dependencies
        shell: pwsh
        run: ./tools/dev.ps1 restore
      - name: Fetch pinned native source
        shell: pwsh
        run: ./tools/fetch-f00-dependencies.ps1
      - name: Build native libraries (static CRT)
        shell: pwsh
        run: node tools/run-clean-env.mjs pwsh -NoProfile -File tools/build-native.ps1
      - name: Publish NativeAOT probe executable
        shell: pwsh
        run: node tools/run-clean-env.mjs pwsh -NoProfile -File tools/dev.ps1 publish
      - name: UI tests and builds (locked)
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm run build
          pnpm run build:probe
      - name: Publish NativeAOT susu.exe (release, no fixtures)
        id: publish_app
        shell: pwsh
        run: node tools/run-clean-env.mjs pwsh -NoProfile -File tools/dev.ps1 publish -Project src/Susu.Host -OutputDirectory artifacts/app
      - name: Publish susu-plugin.exe and stage susu.exe where the tests look for them
        shell: pwsh
        run: |
          node tools/run-clean-env.mjs pwsh -NoProfile -File tools/dev.ps1 publish -Project tools/Susu.PluginCli -OutputDirectory tools/Susu.PluginCli/bin/Release/net10.0/win-x64/publish
          New-Item -ItemType Directory -Force src/Susu.Host/bin/Release/net10.0/win-x64/publish | Out-Null
          Copy-Item artifacts/app/* src/Susu.Host/bin/Release/net10.0/win-x64/publish -Recurse -Force
      # Tests run after the native and NativeAOT outputs exist: real-sandbox, QuickJS, selection-helper
      # and CLI tests use them and do not skip when they are missing.
      - name: Unit and contract tests
        shell: pwsh
        run: |
          ./tools/dev.ps1 build
          ./tools/dev.ps1 test
          dotnet run --project tools/Susu.ContractsGen -c Release --no-build -- . --check
      - name: Shell lifecycle smoke (F03)
        shell: pwsh
        run: |
          $p = Start-Process artifacts/app/susu.exe -ArgumentList "--data-root `"$env:RUNNER_TEMP/susu`" --smoke artifacts/app/smoke.json --cycles 3" -PassThru -Wait
          Get-Content artifacts/app/smoke.json
          exit $p.ExitCode
      - name: Execute published probes
        shell: pwsh
        run: |
          ./artifacts/probes/Susu.Probes.exe | Tee-Object artifacts/probes/result.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: AppContainer access matrix (X01-X07 prototype)
        shell: pwsh
        run: ./artifacts/probes/Susu.Probes.exe --x-matrix artifacts/probes/x-matrix.json
      - name: License inventory
        run: node tools/license-inventory.mjs artifacts/probes/license-inventory.json tools/Susu.Probes/packages.lock.json
      # Built whenever the app published, even if tests failed, so the installer can be tried on a
      # physical machine. The run still reports the test failure; such a build is not a release.
      - name: Build per-user installer (F18.1, unsigned)
        id: installer
        if: ${{ !cancelled() && steps.publish_app.outcome == 'success' }}
        shell: pwsh
        run: |
          ./tools/build-installer.ps1 -Version 0.1.0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        with:
          name: susu-installer
          path: |
            artifacts/installer/*.exe
            artifacts/installer/stage/staged-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-aot-probes
          path: |
            artifacts/probes/
            artifacts/app/smoke.json
