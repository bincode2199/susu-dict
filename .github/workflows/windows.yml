name: Windows NativeAOT probes
on: [push, pull_request, workflow_dispatch]
jobs:
  probes:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Restore locked dependencies
        shell: pwsh
        run: ./tools/dev.ps1 restore
      - name: Fetch pinned native source
        shell: pwsh
        run: ./tools/fetch-f00-dependencies.ps1
      - name: Build native bridge
        shell: pwsh
        run: node tools/run-clean-env.mjs pwsh -NoProfile -File tools/build-native.ps1
      - name: Publish NativeAOT
        shell: pwsh
        run: node tools/run-clean-env.mjs pwsh -NoProfile -File tools/dev.ps1 publish
      - name: Execute published probes
        shell: pwsh
        run: |
          ./artifacts/probes/Susu.Probes.exe | Tee-Object artifacts/probes/result.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-aot-probes
          path: artifacts/probes/
