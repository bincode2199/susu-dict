id: app.susu.openai
name: OpenAI
apiVersion: 1
minHost: 1
entry: main.js
capabilities:
  - translate
hosts:
  - api.openai.com
credentialUse:
  - apiKey
config:
  type: object
  properties:
    model:
      type: string
      title: Model
      default: gpt-4o-mini
      x-susu:
        placeholder: gpt-4o-mini
        optionsSource:
          dependsOn: [baseUrl, apiKey]
    baseUrl:
      type: string
      format: uri
      title: API address
      x-susu:
        group: advanced
        placeholder: https://api.openai.com
        help: An OpenAI-compatible server; leave empty for api.openai.com.
    temperature:
      type: number
      title: Temperature
      minimum: 0
      maximum: 2
      x-susu:
        group: advanced
        placeholder: "1"
        help: Sampling temperature from 0 to 2; leave empty for the model default.
