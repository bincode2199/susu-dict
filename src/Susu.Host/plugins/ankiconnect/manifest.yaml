id: app.susu.ankiconnect
name: Anki (AnkiConnect)
apiVersion: 1
minHost: 1
entry: main.js
capabilities:
  - vocab
hosts:
  - http://127.0.0.1:8765
credentialUse:
  - apiKey
config:
  type: object
  properties:
    deck:
      type: string
      title: Deck
      default: Su-Su
      x-susu:
        placeholder: Su-Su
        help: The deck new cards are added to. It is created when it does not exist.
        optionsSource:
          dependsOn: [baseUrl]
    useApiKey:
      type: boolean
      title: Use an AnkiConnect API key
      default: false
      x-susu:
        help: Turn on only when AnkiConnect is configured with an apiKey.
    baseUrl:
      type: string
      format: uri
      title: AnkiConnect address
      x-susu:
        group: advanced
        placeholder: http://127.0.0.1:8765
        help: Leave empty for AnkiConnect on this computer.
