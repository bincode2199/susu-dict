  <style>
    body { margin: 0; background: #EDEEF0;
      font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    textarea, input { font: inherit; color: inherit; background: none; border: 0; padding: 0; outline: none; }

    a { color: #2D64E0; } a:hover { color: #1F4CB4; }

    /* —— 窗口 —— */
    .win { box-sizing: border-box; background: #FFFFFF; border: 1px solid #D9DCE0; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; color: #16181D; }
    .tbar { height: 40px; flex-shrink: 0; display: flex; align-items: center; border-bottom: 1px solid #E4E6E9; }
    .app { display: flex; align-items: center; gap: 8px; padding-left: 12px; }

    .g { flex-grow: 1; }
    .sys { width: 46px; height: 39px; display: flex; align-items: center; justify-content: center; color: #16181D; }
    .tb { width: 36px; height: 32px; display: flex; align-items: center; justify-content: center; color: #5C6169; }
    .sbar { height: 32px; flex-shrink: 0; padding: 0 12px; display: flex; align-items: center; border-top: 1px solid #E4E6E9; }

    /* —— 图标按钮 —— */
    .ib { width: 28px; height: 28px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #5C6169; flex-shrink: 0; }
    .ib26 { width: 26px; height: 26px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #5C6169; flex-shrink: 0; }
    .ib30 { width: 30px; height: 30px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #5C6169; flex-shrink: 0; }

    /* —— 卡片 —— */
    .card { border: 1px solid #E4E6E9; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
    .card.src { border-color: #C9CDD3; }
    .chd { height: 38px; padding: 0 6px; display: flex; align-items: center; gap: 6px; }
    .cbody { padding: 0 14px 14px 38px; font-size: 14.5px; line-height: 1.75; }
    .eng { font-size: 12.5px; font-weight: 600; }

    /* —— 文字 —— */
    .h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }
    .h2 { margin: 0; font-size: 12.5px; font-weight: 600; }
    .sub { margin: 0; font-size: 12.5px; line-height: 1.6; color: #5C6169; }
    .sec { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #757B84; }
    .m { font-size: 11px; color: #757B84; }
    .ms { font-size: 10.5px; color: #757B84; }
    .t { font-size: 12px; }
    .t125 { font-size: 12.5px; }
    .err { font-size: 12.5px; color: #A03A2C; }

    /* —— 控件 —— */
    .btn { height: 28px; padding: 0 12px; border: 1px solid #D0D3D8; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #16181D; flex-shrink: 0; }
    .btn.sm { height: 26px; padding: 0 10px; }
    .btn.dis { border-color: #E4E6E9; color: #A7ACB3; cursor: default; }
    .tag { height: 20px; padding: 0 7px; border: 1px solid #D0D3D8; border-radius: 4px; display: inline-flex; align-items: center; font-size: 10.5px; color: #5C6169; flex-shrink: 0; }
    .sel { height: 28px; padding: 0 8px; border-radius: 5px; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; flex-shrink: 0; }
    .field { height: 28px; padding: 0 9px; border: 1px solid #D0D3D8; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-size: 12px; box-sizing: border-box; }
    .kbd { height: 26px; padding: 0 9px; border: 1px solid #D0D3D8; border-radius: 5px; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; flex-shrink: 0; }
    .sw { width: 34px; height: 18px; box-sizing: border-box; border: 1px solid #C9CDD3; border-radius: 9px; display: flex; align-items: center; padding: 0 2px; flex-shrink: 0; }
    .sw i { width: 12px; height: 12px; border-radius: 50%; background: #C9CDD3; display: block; }
    .sw.on { justify-content: flex-end; }
    .ck { width: 14px; height: 14px; box-sizing: border-box; border: 1px solid #C9CDD3; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .rd { width: 14px; height: 14px; box-sizing: border-box; border: 1px solid #C9CDD3; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .rd i { width: 6px; height: 6px; border-radius: 50%; display: block; }

    /* —— 设置 —— */
    .nav { width: 190px; flex-shrink: 0; border-right: 1px solid #E4E6E9; padding: 8px 0; display: flex; flex-direction: column; gap: 1px; }
    .navi { height: 32px; padding: 0 12px 0 14px; display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: #5C6169; border-left: 2px solid transparent; box-sizing: border-box; }
    .navi.on { color: #16181D; font-weight: 600; }
    .pane { flex-grow: 1; min-width: 0; padding: 20px 26px; display: flex; flex-direction: column; gap: 22px; overflow: hidden; }
    .grp { display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid #E4E6E9; }
    .rowd { font-size: 11px; color: #757B84; margin-top: 3px; line-height: 1.5; }

    /* —— 菜单 / 浮层 —— */
    .pop { box-sizing: border-box; background: #FFFFFF; border: 1px solid #D9DCE0; border-radius: 8px; color: #16181D; }
    .mi { height: 32px; padding: 0 10px; border-radius: 5px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #16181D; }
    .hr { height: 1px; background: #E4E6E9; }
  </style>
</helmet>
